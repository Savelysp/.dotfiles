# =============================================================================
# tmux.conf — конфигурация tmux
#
# Префикс: C-b. Перезагрузка: prefix + r.
# Документация: ~/.config/tmux/README.md
# Проверено на tmux 3.7.
# =============================================================================

# =============================================================================
# 1. СЕРВЕР И ТЕРМИНАЛ
# =============================================================================

# Внутренний TERM. Нужен для корректной работы 256 цветов и terminfo.
set -s default-terminal "tmux-256color"

# Не ждать 500 мс после Esc. 10 мс — безопасный компромисс для vim/nvim.
set -s escape-time 10

# Передавать события фокуса приложениям (нужно nvim для autoread/focus).
set -s focus-events on

# Расширенные клавиши: Ctrl/Alt/Shift-модификаторы доходят до приложений.
set -s extended-keys on

# Разрешить приложениям управлять системным буфером обмена (OSC 52).
set -s set-clipboard on

# Alacritty умеет RGB, расширенные клавиши, гиперссылки и overline.
# Если терминал другой — добавь аналогичную строку для его TERM.
set -as terminal-features "alacritty*:clipboard:ccolour:cstyle:focus:title:RGB:extkeys:hyperlinks:overline"
set -as terminal-features "xterm*:clipboard:ccolour:cstyle:focus:title:RGB:extkeys:hyperlinks:overline"

# Пропускать escape-последовательности приложений (картинки в yazi и т.п.).
setw -g allow-passthrough on

# Заголовок окна терминала: сессия:окно[:имя].
set -g set-titles on
set -g set-titles-string "#S:#I#{?window_name,: #W,}"

# =============================================================================
# 2. ПОВЕДЕНИЕ
# =============================================================================

set -g mouse on

# Нумерация окон и панелей с 1.
set -g base-index 1
setw -g pane-base-index 1

# После закрытия окна не оставлять дыр в нумерации.
set -g renumber-windows on

# Большой scrollback.
set -g history-limit 50000

# Обновлять статус-бар чаще, чем раз в 15 секунд.
set -g status-interval 5

# Сообщения tmux показывать 2 секунды.
set -g display-time 2000

# В command prompt tmux — emacs-режим (в copy-mode остаётся vi).
set -g status-keys emacs

# vi-режим в copy-mode.
setw -g mode-keys vi

# Автопереименование окон: по умолчанию имя пустое, поэтому в статусе
# показывается только индекс. Вручную переименованное окно показывает имя.
setw -g automatic-rename on
setw -g automatic-rename-format ""

# Приложения не могут переименовывать окна через escape-последовательности.
setw -g allow-rename off

# Подсвечивать активность окон в статус-баре.
setw -g monitor-activity on
set -g visual-activity off

# Двойные линии рамок панелей.
setw -g pane-border-lines double

# =============================================================================
# 3. КЛАВИШИ
# =============================================================================

# Перезагрузка конфига.
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux: конфиг перезагружен"

# Split: | — рядом, - — сверху/снизу. Новые панели в текущем каталоге.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Навигация по панелям.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Изменение размера панели; -r позволяет повторять без повторного префикса.
# Используем C-h/j/k/l, чтобы не переопределять стандартный prefix + L
# (переход к последней сессии).
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# Новое окно в текущем каталоге.
bind c new-window -c "#{pane_current_path}"

# Убить сессию с подтверждением (замена tmux-sessionist).
bind X confirm-before -p "Kill session #S? (y/n)" kill-session

# =============================================================================
# 4. COPY-MODE И БУФЕР ОБМЕНА
# =============================================================================

# В tmux 3.7 v по умолчанию включает rectangle-toggle; возвращаем выделение.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line

# y — скопировать выделенное в системный буфер Wayland.
# На X11 замени wl-copy на: xclip -in -selection clipboard
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"

# =============================================================================
# 5. ПЛАГИНЫ
# =============================================================================

# TPM и плагины живут рядом с конфигом. Если путь другой — измени здесь.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux#v2.3.2'

# Восстановление сессий после перезапуска.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-dir '~/.local/share/tmux/resurrect'

# Не сохранять содержимое панелей: меньше данных на диске и риск утечки.
set -g @resurrect-capture-pane-contents 'off'

# Тема Catppuccin.
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_status_background '#{@thm_bg}'
set -g @catppuccin_window_status_style 'none'
set -g @catppuccin_pane_status_enabled 'off'
set -g @catppuccin_pane_border_status 'off'

# =============================================================================
# 6. СТАТУС-БАР
# =============================================================================

set -g status-position top
set -g status-justify absolute-centre
set -g status-style "bg=#{@thm_bg}"
set -g status-left-length 100
set -g status-right-length 100

# Слева: имя сессии. При нажатом префиксе — красный фон, при zoom/sync — метки.
set -g status-left "#{?client_prefix,#[bg=#{@thm_red},fg=#{@thm_bg},bold] #S #[default],#[bg=#{@thm_bg},fg=#{@thm_green}] #S }#{?window_zoomed_flag,#[bg=#{@thm_bg},fg=#{@thm_yellow}] Z ,}#{?pane_synchronized,#[bg=#{@thm_bg},fg=#{@thm_mauve}] SYNC ,}"

# Справа: дата и время.
set -g status-right "#[bg=#{@thm_bg},fg=#{@thm_blue}] 󰭦 %Y-%m-%d 󰅐 %H:%M "

# Окна: только индекс, пока окно не переименовано вручную.
set -g window-status-format " #{?#{window_name},#I: #W,#I} "
set -g window-status-current-format " #{?#{window_name},#I: #W,#I} "
set -g window-status-style "bg=#{@thm_bg},fg=#{@thm_rosewater}"
set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_peach}"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"

set -g window-status-current-style "bg=#{@thm_peach},fg=#{@thm_bg},bold"

# =============================================================================
# 7. ЗАПУСК TPM
# =============================================================================

# Если TPM не установлен — не молчим, а подсказываем, что делать.
if-shell "test -x ~/.config/tmux/plugins/tpm/tpm" \
  "run '~/.config/tmux/plugins/tpm/tpm'" \
  "display-message 'tmux: TPM не найден — см. ~/.config/tmux/README.md'"
